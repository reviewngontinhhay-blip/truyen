<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔮 Phù Thuỷ Chỉ Muốn Đọc Truyện — Danh mục truyện</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f0ff;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }
    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 1.7rem; color: #6a30c0; margin-bottom: 8px; }
    header p { color: #888; font-size: 0.9rem; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }
    .empty {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      padding: 48px 0;
    }
    footer { margin-top: 48px; font-size: 0.8rem; color: #bbb; text-align: center; }
    .back { margin-bottom: 20px; font-size: 0.85rem; color: #6a30c0; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="back" href="../">← Về trang chủ</a>
  <header>
    <h1>🔮 Phù Thuỷ Chỉ Muốn Đọc Truyện</h1>
    <p>Danh mục truyện đang giới thiệu · Cập nhật thường xuyên 💕</p>
  </header>
  <div class="card-grid">
    <div class="empty">✨ Truyện sắp ra mắt — theo dõi page để không bỏ lỡ nhé!</div>
  </div>
  <footer>Muốn múc hộ full bộ? Nhắn qua page Phù Thuỷ Chỉ Muốn Đọc Truyện nhé 👀</footer>
</body>
</html>
